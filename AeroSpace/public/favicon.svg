<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark Cockpit Background -->
  <rect width="32" height="32" rx="7" fill="#07090e" />
  
  <!-- Subtle Aerospace Instrument Outer Bezel -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#ff5722" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Clean Geometric Capital 'A' Legs (High-contrast Off-White Titanium) -->
